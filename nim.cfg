# isonim's own `isonim/core/platform` imports `nim_everywhere/platform`, so
# every module that reaches isonim (test_cross_renderer,
# test_scenario_snapshots, app_entry, app_entry_native) fails without this path
# with
#     isonim/src/isonim/core/platform.nim(4, 22) Error: cannot open file:
#     nim_everywhere/platform
# followed by a cascade of `HashMapRef` errors out of `isonim/core/graph.nim`.
# Declared here so `just test-cross`, `just test-scenarios` and CI all get it.
--path:"../nim-everywhere/src"
