name: CI

on:
  push:
    branches: [main, dev, stable]
  pull_request:
    branches: [main, dev, stable]

jobs:
  nim-tests:
    name: Nim tests (macOS)
    # macOS-only by nature (AppKit/Cocoa bindings); single macOS Nix class.
    runs-on: [self-hosted, macos, arm64]
    steps:
      # The suites compile against two sibling repositories that are not part
      # of this checkout: `nim.cfg` puts `../isonim/src` and
      # `../nim-everywhere/src` on the module path. isonim used to come from a
      # second `actions/checkout` with `path: ../isonim`, which
      # `actions/checkout` refuses ("Repository path '.../isonim-cocoa/isonim'
      # is not under '.../isonim-cocoa/isonim-cocoa'"), so this job died on its
      # second step on every run, and nim-everywhere was never cloned at all.
      #
      # `setup-dev-env` clones each entry of `.github/sibling-repos` to
      # `../<name>` at the revision recorded there, and provisions Nix with the
      # shared setup-nix action (Nix is already on the self-hosted runners;
      # binary-cache traffic goes through the org Attic substituter), which
      # replaces the DeterminateSystems installer and magic-nix-cache actions.
      # Its token is minted from the CI Token Provider app, the same way
      # `ci-reprobuild.yml` mints it.
      - name: Mint installation token for cross-repo sibling clones
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - uses: actions/checkout@v4

      - name: Setup dev env (clones .github/sibling-repos)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}

      - name: nim check (renderer — AppKit surface)
        run: nix develop -c bash -c "nim check src/isonim_cocoa/renderer.nim"

      - name: Run ObjC runtime tests
        run: nix develop -c bash -c "just test-objc"

      - name: Run AppKit view tests
        run: nix develop -c bash -c "just test-views"

      - name: Run renderer tests
        run: nix develop -c bash -c "just test-renderer"

      - name: Run test infrastructure tests
        run: nix develop -c bash -c "just test-infra"

      - name: Run cross-renderer compatibility tests
        run: nix develop -c bash -c "just test-cross"

      - name: Run branded scenario snapshots
        run: nix develop -c bash -c "just test-scenarios"

      # The task-manager demo's end-to-end test lives in
      # `isonim-examples/tests/test_cocoa_leaves_macos_only.nim` since
      # EX-M5 (the standalone `demos/task-manager/src/main.nim` was
      # deleted alongside the duplicated source). Cross-renderer
      # parity (TUI / web / GPUI / Freya / Cocoa) is covered in
      # `isonim-examples/tests/test_vm_parity_across_renderers.nim`.
      # Cross-repo CI gating happens in the `isonim-examples`
      # workflow; this repo only verifies the renderer + bindings +
      # AppKit surface here.
